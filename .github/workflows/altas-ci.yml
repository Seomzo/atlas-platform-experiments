name: Altas prototype

on:
  pull_request:
    paths:
      - "altas/**"
      - "plugins/model-providers/altas/**"
      - "tests/altas/**"
      - "scripts/altas-smoke.py"
      - "agent/agent_runtime_helpers.py"
      - "agent/tool_executor.py"
      - "model_tools.py"
      - "pyproject.toml"
      - "requirements-altas-dev.txt"
      - ".github/workflows/altas-ci.yml"
  push:
    branches:
      - "product/**"
    paths:
      - "altas/**"
      - "plugins/model-providers/altas/**"
      - "tests/altas/**"
      - "scripts/altas-smoke.py"
      - "agent/agent_runtime_helpers.py"
      - "agent/tool_executor.py"
      - "model_tools.py"
      - "pyproject.toml"
      - "requirements-altas-dev.txt"
      - ".github/workflows/altas-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: altas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-altas-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install focused dependencies
        run: python -m pip install -r requirements-altas-dev.txt

      - name: Compile Altas modules
        run: python -m compileall -q altas scripts/altas-smoke.py

      - name: Lint and format check
        run: |
          python -m ruff check altas tests/altas scripts/altas-smoke.py plugins/model-providers/altas model_tools.py agent/tool_executor.py agent/agent_runtime_helpers.py
          python -m ruff format --check altas tests/altas scripts/altas-smoke.py plugins/model-providers/altas
          node --check altas/control_plane/static/app.js
          git diff --check

      - name: Build distributions and verify packaged Altas CLI
        if: matrix.python-version == '3.12'
        run: |
          python -m build --wheel --sdist --outdir dist
          python -m venv .packaging-venv
          .packaging-venv/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.packaging-venv/bin/altas" --version

      - name: Run focused test suite
        run: python -m pytest -q tests/altas

      - name: Run upstream dispatch regression tests
        run: >-
          python -m pytest -q
          tests/test_model_tools.py
          tests/test_model_tools_async_bridge.py
          tests/test_dispatch_session_id.py
          tests/test_transform_tool_result_hook.py

      - name: Run walking-skeleton smoke test
        env:
          PYTHONPATH: .
        run: python scripts/altas-smoke.py
